---
# 毎週月曜日の朝10時に実行
x-schedule: &schedule
  interval: "weekly"
  day: "monday"
  time: "10:00"
  timezone: "Asia/Tokyo"

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: *schedule
    groups:
      uv-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: *schedule
    groups:
      github-actions-deps:
        patterns:
          - "*"
