---
name: Qualify Code

"on":
  push:
  pull_request:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
        default: "3.13"
      dotenvx-env-file:
        description: "dotenvx で扱う環境変数ファイル（未指定/存在しない場合はスキップ）"
        required: false
        type: string
        default: ".env"
      runner:
        description: "ジョブを実行する runner ラベル。self-hosted 化する呼び出し側だけ上書きする。"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      DOTENV_PRIVATE_KEY:
        required: false

permissions:
  contents: read # minimal: checkout only

# yamllint disable rule:line-length
# ============================================================================
# ジョブ構成の概要
# ============================================================================
# このワークフローは以下の3つのジョブで構成されています：
#
#   setup ─────┬──→ lint-and-test (ruff, ty, pytest を順次実行)
#              │
#              └──→ mypy (並列実行)
#
# mypy は他のツールに比べて実行時間が長いため、別ジョブに分離して並列実行する
# ことで、全体の実行時間を短縮しています。
#
# 実行時間の目安：
#   - 元の構成（順次実行）: setup + ruff + ty + mypy + pytest
#   - 新しい構成（並列実行）: setup + max(lint-and-test, mypy)
#
# ============================================================================
jobs:
  # ==========================================================================
  # setup ジョブ
  # ==========================================================================
  # 変更ファイルの検出、利用可能なツールの検出を行い、
  # その結果を outputs として後続ジョブに渡す。
  # GITHUB_ENV はジョブ内でしか有効でないため、ジョブ間のデータ共有には
  # outputs を使用する必要がある。
  setup:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # 後続ジョブに渡す情報
    # - any_changed: Python関連ファイルに変更があったか（false なら後続ジョブはスキップ）
    # - ruff/mypy/ty/pytest: 各ツールがプロジェクトで利用可能か
    # - mypy_use_dot: mypy を "mypy ." で実行するか "mypy" で実行するか
    # - dotenvx_run_prefix: 暗号化された.envファイルを復号するためのコマンドプレフィックス
    # - dotenvx_key_name: 復号に使用する環境変数名（DOTENV_PRIVATE_KEY または DOTENV_PRIVATE_KEY_XXX）
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      ruff: ${{ steps.detect-tools.outputs.ruff }}
      mypy: ${{ steps.detect-tools.outputs.mypy }}
      mypy_use_dot: ${{ steps.mypy-target.outputs.use_dot }}
      ty: ${{ steps.detect-tools.outputs.ty }}
      pytest: ${{ steps.detect-tools.outputs.pytest }}
      dotenvx_run_prefix: ${{ steps.dotenvx.outputs.run_prefix }}
      dotenvx_key_name: ${{ steps.dotenvx.outputs.key_name || '_UNUSED_DOTENV_KEY' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout shared .github scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-config
          fetch-depth: 1
          token: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN || github.token }}

      - name: Detect relevant changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.py
            pyproject.toml
            uv.lock
            mise.toml

      - name: Skip checks (no relevant changes)
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No Python or dependency changes detected; skipping quality checks."

      # 自身のprivateリポジトリからパッケージを取得する場合の認証設定
      - name: Configure git auth
        run: |
          git config --global url."https://${TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN }}

      - name: Detect dotenvx encrypted env file
        id: dotenvx
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          ENV_FILE_INPUT="${{ inputs['dotenvx-env-file'] || '.env' }}"
          if [ -z "$ENV_FILE_INPUT" ] || [ ! -f "$ENV_FILE_INPUT" ]; then
            echo "run_prefix=" >> "$GITHUB_OUTPUT"
            # env の動的キーに空文字列を指定すると GitHub Actions がエラーになるため、
            # 使用しない場合でも有効なキー名を設定する（値は空なので影響なし）
            echo "key_name=_UNUSED_DOTENV_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eq 'DOTENV_PUBLIC_KEY|encrypted:' "$ENV_FILE_INPUT"; then
            echo "run_prefix=" >> "$GITHUB_OUTPUT"
            echo "key_name=_UNUSED_DOTENV_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$DOTENV_PRIVATE_KEY" ]; then
            echo "DOTENV_PRIVATE_KEY secret is required to decrypt $ENV_FILE_INPUT." >&2
            exit 1
          fi

          if ! command -v npx >/dev/null 2>&1; then
            echo "npx is required to run dotenvx in this workflow." >&2
            exit 1
          fi

          base="$(basename "$ENV_FILE_INPUT")"
          suffix=""
          if [ "$base" = ".env" ]; then
            suffix=""
          elif [[ "$base" == .env.* ]]; then
            suffix="${base#.env.}"
          fi

          if [ -n "$suffix" ]; then
            suffix="$(echo "$suffix" | tr '[:lower:]' '[:upper:]' | tr '.-' '_' | tr -c 'A-Z0-9_' '_')"
            key_name="DOTENV_PRIVATE_KEY_${suffix}"
          else
            key_name="DOTENV_PRIVATE_KEY"
          fi

          echo "run_prefix=npx --yes @dotenvx/dotenvx run -f $ENV_FILE_INPUT --" >> "$GITHUB_OUTPUT"
          echo "key_name=$key_name" >> "$GITHUB_OUTPUT"

      - name: Set up UV
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Sync dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv sync --frozen --all-extras

      - name: Detect available quality tools
        id: detect-tools
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -n "${{ steps.dotenvx.outputs.run_prefix }}" ]; then
            ${{ steps.dotenvx.outputs.run_prefix }} uv run python .github-config/.github/scripts/detect_quality_tools.py --pyproject pyproject.toml
          else
            uv run python .github-config/.github/scripts/detect_quality_tools.py --pyproject pyproject.toml
          fi
        env:
          ${{ steps.dotenvx.outputs.key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Decide mypy target
        id: mypy-target
        if: steps.changed-files.outputs.any_changed == 'true' && steps.detect-tools.outputs.mypy == 'true'
        run: |
          if [ -n "${{ steps.dotenvx.outputs.run_prefix }}" ]; then
            ${{ steps.dotenvx.outputs.run_prefix }} uv run python .github-config/.github/scripts/decide_mypy_target.py --pyproject pyproject.toml
          else
            uv run python .github-config/.github/scripts/decide_mypy_target.py --pyproject pyproject.toml
          fi
        env:
          ${{ steps.dotenvx.outputs.key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}

  # ==========================================================================
  # lint-and-test ジョブ
  # ==========================================================================
  # ruff, ty, pytest を順次実行する。
  # これらのツールは実行時間が短い（数秒〜数十秒）ため、ジョブを分割する
  # オーバーヘッド（チェックアウト、依存関係インストール）に見合わないので、
  # 1つのジョブにまとめている。
  #
  # mypy ジョブと並列で実行される。
  lint-and-test:
    needs: setup
    if: needs.setup.outputs.any_changed == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout shared .github scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-config
          fetch-depth: 1
          token: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN || github.token }}

      - name: Configure git auth
        run: |
          git config --global url."https://${TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN }}

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      # dotenvx_run_prefix が設定されている場合は、暗号化された .env を復号してから実行する。
      # env の動的キー (${{ needs.setup.outputs.dotenvx_key_name || '_UNUSED_DOTENV_KEY' }}) は GitHub Actions の機能で、
      # setup ジョブで決定された環境変数名（DOTENV_PRIVATE_KEY または DOTENV_PRIVATE_KEY_XXX）を使用する。
      - name: Run ruff check
        if: needs.setup.outputs.ruff == 'true'
        # この .github ディレクトリを checkout している .github-config を ruff check から除外して実行する
        run: |
          if [ -n "${{ needs.setup.outputs.dotenvx_run_prefix }}" ]; then
            ${{ needs.setup.outputs.dotenvx_run_prefix }} uv run ruff check . --extend-exclude .github-config
          else
            uv run ruff check . --extend-exclude .github-config
          fi
        env:
          ${{ needs.setup.outputs.dotenvx_key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Run ty
        if: needs.setup.outputs.ty == 'true'
        # この .github ディレクトリを checkout している .github-config を ty check から除外して実行する
        run: |
          if [ -n "${{ needs.setup.outputs.dotenvx_run_prefix }}" ]; then
            ${{ needs.setup.outputs.dotenvx_run_prefix }} uv run ty check . --error-on-warning --exclude ".github-config/**"
          else
            uv run ty check . --error-on-warning --exclude ".github-config/**"
          fi
        env:
          ${{ needs.setup.outputs.dotenvx_key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}

      # vulture の導入を検討しているが、100%検知ができるわけではないので一旦保留
      # - name: Run vulture (unused code)
      #   if: needs.setup.outputs.vulture == 'true'
      #   run: |
      #     paths=""
      #     [ -d src ] && paths="$paths src"
      #     [ -d tests ] && paths="$paths tests"
      #     if [ -z "$paths" ]; then
      #       paths="."
      #     fi
      #     uv run vulture $paths --min-confidence 80 --exclude alembic

      - name: Run pytest
        if: needs.setup.outputs.pytest == 'true'
        run: |
          if [ -n "${{ needs.setup.outputs.dotenvx_run_prefix }}" ]; then
            ${{ needs.setup.outputs.dotenvx_run_prefix }} uv run pytest tests/
          else
            uv run pytest tests/
          fi
        env:
          ${{ needs.setup.outputs.dotenvx_key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}

  # ==========================================================================
  # mypy ジョブ
  # ==========================================================================
  # mypy は実行時間が長い（数分かかることがある）ため、別ジョブに分離して
  # lint-and-test ジョブと並列で実行することで、全体の実行時間を短縮する。
  #
  # 条件:
  # - any_changed == 'true': Python関連ファイルに変更がある
  # - mypy == 'true': プロジェクトで mypy が利用可能
  mypy:
    needs: setup
    if: needs.setup.outputs.any_changed == 'true' && needs.setup.outputs.mypy == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure git auth
        run: |
          git config --global url."https://${TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN }}

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: |
          if [ -n "${{ needs.setup.outputs.dotenvx_run_prefix }}" ]; then
            if [[ "${{ needs.setup.outputs.mypy_use_dot }}" == "true" ]]; then
              ${{ needs.setup.outputs.dotenvx_run_prefix }} uv run mypy .
            else
              ${{ needs.setup.outputs.dotenvx_run_prefix }} uv run mypy
            fi
          else
            if [[ "${{ needs.setup.outputs.mypy_use_dot }}" == "true" ]]; then
              uv run mypy .
            else
              uv run mypy
            fi
          fi
        env:
          ${{ needs.setup.outputs.dotenvx_key_name || '_UNUSED_DOTENV_KEY' }}: ${{ secrets.DOTENV_PRIVATE_KEY }}
