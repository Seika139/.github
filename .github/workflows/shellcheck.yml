---
name: shellcheck

"on":
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read # minimal: checkout only

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect relevant changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.sh
            **/*.bash

      - name: Skip checks (no relevant changes)
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No shell script changes detected; skipping shellcheck."

      - name: Run shellcheck
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # -x: source されたスクリプトも追跡
          # -P SCRIPTDIR: スクリプトのディレクトリから相対パスを解決
          # .shellcheckrc はリポジトリルートから自動検索される
          find . -type f \( -name "*.sh" -o -name "*.bash" \) \
            -exec shellcheck -x -P SCRIPTDIR {} +
