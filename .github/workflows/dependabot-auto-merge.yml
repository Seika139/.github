---
name: Dependabot Auto Merge

"on":
  workflow_call:
    inputs:
      merge_method:
        type: string
        default: "merge"
        description: "マージ方法: merge | squash | rebase"
      allowed_update_types:
        type: string
        default: "version-update:semver-patch,version-update:semver-minor"
        description: "自動マージを許可する update-type のカンマ区切りリスト"

permissions:
  contents: write # auto-merge の予約に必要
  pull-requests: write # PR の更新に必要

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # PR の作成者が Dependabot でなければ job 自体を実行しない
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # update-type が空のとき contains が true になるのを防ぐため空判定を併記する。
        # allowed_update_types をカンマでアンカーし、部分一致による誤許可を防ぐ
        if: >-
          steps.metadata.outputs.update-type != '' &&
          contains(format(',{0},', inputs.allowed_update_types), format(',{0},', steps.metadata.outputs.update-type))
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        run: gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
