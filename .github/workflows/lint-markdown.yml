---
name: Lint Markdown

"on":
  push:
  pull_request:
  workflow_call:
    inputs:
      markdown_glob:
        description: "Markdownファイルのグロブパターン。注意: ローカル設定ファイル内の 'globs' 設定よりもこちらが優先されます。"
        required: false
        type: string
        # default を削除（空なら空として扱うため）
    secrets:
      PUSH_AND_RUN_WORKFLOW_TOKEN:
        required: false

permissions:
  contents: write # allow pushing auto-fix commits to PR branches
  pull-requests: read # read PR metadata for head ref

env:
  NODE_VERSION: "24"
  SHARED_RUMDL_CONFIG: .github-config/.github/config/.rumdl.toml
  # デフォルト値を削除（空なら空のまま渡す）
  MARKDOWN_GLOB: ${{ inputs.markdown_glob }}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout shared .github config
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-config
          fetch-depth: 1
          token: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN || github.token }}

      - name: Detect markdown changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            # 変更検知にはデフォルトで全ファイルを含めておく（過大評価は安全なため）
            ${{ env.MARKDOWN_GLOB || '**/*.md' }}

      - name: Skip checks (no markdown changes)
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No markdown changes detected; skipping linting."

      # 優先順位:
      #   1. ローカルに rumdl 設定あり -> rumdl (local 設定)
      #   2. ローカルに markdownlint-cli2 設定あり -> markdownlint (local 設定)
      #   3. どちらも無い -> rumdl (shared 設定 .github-config/.github/config/.rumdl.toml)
      - name: Detect linter tool
        id: detect-tool
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          tool=
          rumdl_config=
          if [ -f .rumdl.toml ] || [ -f rumdl.toml ]; then
            tool=rumdl
            rumdl_config=local
          elif [ -f pyproject.toml ] && grep -Eq '^\[tool\.rumdl(\]|\.)' pyproject.toml; then
            tool=rumdl
            rumdl_config=local
          else
            md_found=false
            for f in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml \
              .markdownlint-cli2.json .markdownlint-cli2.cjs \
              .markdownlint-cli2.mjs .markdownlint.json \
              .markdownlint.yaml .markdownlint.yml; do
              if [ -f "$f" ]; then
                md_found=true
                break
              fi
            done
            if [ "$md_found" = "true" ]; then
              tool=markdownlint
            else
              tool=rumdl
              rumdl_config=shared
            fi
          fi
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          echo "rumdl_config=$rumdl_config" >> "$GITHUB_OUTPUT"
          echo "Detected linter: $tool (rumdl_config=${rumdl_config:-n/a})"

      - name: Install rumdl
        if: steps.changed-files.outputs.any_changed == 'true' && steps.detect-tool.outputs.tool == 'rumdl'
        run: |
          curl -LsSf https://github.com/rvben/rumdl/releases/latest/download/rumdl-linux-x86_64.tar.gz \
            | sudo tar xzf - -C /usr/local/bin
          rumdl --version

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true' && steps.detect-tool.outputs.tool == 'markdownlint'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint-cli2
        if: steps.changed-files.outputs.any_changed == 'true' && steps.detect-tool.outputs.tool == 'markdownlint'
        run: npm install -g markdownlint-cli2

      - name: Run rumdl with auto-fix (PR only)
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && steps.detect-tool.outputs.tool == 'rumdl'
          && github.event_name == 'pull_request'
        env:
          RUMDL_CONFIG_SCOPE: ${{ steps.detect-tool.outputs.rumdl_config }}
        run: |
          TARGET="${MARKDOWN_GLOB:-**/*.md}"
          echo "Running rumdl --fix on: $TARGET (config=$RUMDL_CONFIG_SCOPE)"
          if [ "$RUMDL_CONFIG_SCOPE" = "shared" ]; then
            rumdl check --config "$SHARED_RUMDL_CONFIG" --fix "$TARGET" || true
          else
            rumdl check --fix "$TARGET" || true
          fi

      - name: Run markdownlint with auto-fix (PR only)
        # markdownlint パスに来るのはローカル設定が存在するケースのみ。
        # shared fallback は rumdl 側に集約したのでここには無い。
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && steps.detect-tool.outputs.tool == 'markdownlint'
          && github.event_name == 'pull_request'
        run: |
          if [ -n "$MARKDOWN_GLOB" ]; then
            echo "Glob provided via input. Overriding configuration globs."
            markdownlint-cli2 --fix "$MARKDOWN_GLOB" || true
          else
            echo "Using local markdownlint configuration globs."
            markdownlint-cli2 --fix || true
          fi

      - name: Check for modifications (PR only)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        id: git-check
        run: |
          git diff --exit-code || echo "modified=true" >> $GITHUB_OUTPUT

      - name: Commit auto-fixes (PR only)
        # github-actions[bot] がプッシュした再実行ではコミットしないことでループを防ぐ
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && github.event_name == 'pull_request'
          && steps.git-check.outputs.modified == 'true'
          && github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Bash の globstar が無効だと "**/*.md" は 1 階層しか拾えずルート直下の .md を取りこぼす。
          # git のパススペック展開に任せるためクォートして渡し、ルート直下も含むよう '*.md' も追加。
          git ls-files -o -m --exclude-standard -- "**/*.md" "*.md" | xargs -r git add
          git commit -m "fix: auto-fix markdown lint issues"

      - name: Push changes (PR only)
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && github.event_name == 'pull_request'
          && steps.git-check.outputs.modified == 'true'
          && github.actor != 'github-actions[bot]'
        run: git push origin HEAD:${{ github.head_ref }}

      - name: Run rumdl (check only)
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && steps.detect-tool.outputs.tool == 'rumdl'
        env:
          RUMDL_CONFIG_SCOPE: ${{ steps.detect-tool.outputs.rumdl_config }}
        run: |
          TARGET="${MARKDOWN_GLOB:-**/*.md}"
          echo "Running rumdl check on: $TARGET (config=$RUMDL_CONFIG_SCOPE)"
          if [ "$RUMDL_CONFIG_SCOPE" = "shared" ]; then
            rumdl check --config "$SHARED_RUMDL_CONFIG" "$TARGET"
          else
            rumdl check "$TARGET"
          fi

      - name: Run markdownlint (check only)
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && steps.detect-tool.outputs.tool == 'markdownlint'
        run: |
          if [ -n "$MARKDOWN_GLOB" ]; then
            markdownlint-cli2 "$MARKDOWN_GLOB"
          else
            markdownlint-cli2
          fi
