---
name: Lint Markdown

"on":
  push:
  pull_request:
  workflow_call:
    inputs:
      markdown_glob:
        description: "Markdownファイルのグロブパターン。注意: ローカル設定ファイル内の 'globs' 設定よりもこちらが優先されます。"
        required: false
        default: "**/*.md"
        type: string
    secrets:
      PUSH_AND_RUN_WORKFLOW_TOKEN:
        required: false

permissions:
  contents: write # allow pushing auto-fix commits to PR branches
  pull-requests: read # read PR metadata for head ref

env:
  NODE_VERSION: "24"
  MARKDOWNLINT_CONFIG: .github-config/.github/config/.markdownlint-cli2.jsonc
  MARKDOWN_GLOB: ${{ inputs.markdown_glob || '**/*.md' }}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout shared .github config
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-config
          fetch-depth: 1
          token: ${{ secrets.PUSH_AND_RUN_WORKFLOW_TOKEN || github.token }}

      - name: Detect markdown changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            ${{ env.MARKDOWN_GLOB }}

      - name: Skip checks (no markdown changes)
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No markdown changes detected; skipping linting."

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint-cli2
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint with auto-fix (PR only)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        run: |
          config_found=false
          for f in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml \
            .markdownlint-cli2.json .markdownlint-cli2.cjs \
            .markdownlint-cli2.mjs .markdownlint.json \
            .markdownlint.yaml .markdownlint.yml; do
            if [ -f "$f" ]; then
              config_found=true
              break
            fi
          done

          if [ "$config_found" = true ]; then
            echo "Local markdownlint configuration found. Using it."
            # 注意: コマンドライン引数は設定ファイル内の 'globs' プロパティよりも優先されます。
            markdownlint-cli2 --fix "$MARKDOWN_GLOB" || true
          elif [ -f "$MARKDOWNLINT_CONFIG" ]; then
            echo "Local configuration not found. Using shared configuration: $MARKDOWNLINT_CONFIG"
            markdownlint-cli2 --config "$MARKDOWNLINT_CONFIG" --fix "$MARKDOWN_GLOB" || true
          else
            echo "No markdownlint configuration found. Using default rules."
            markdownlint-cli2 --fix "$MARKDOWN_GLOB" || true
          fi

      - name: Check for modifications (PR only)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        id: git-check
        run: |
          git diff --exit-code || echo "modified=true" >> $GITHUB_OUTPUT

      - name: Commit auto-fixes (PR only)
        # github-actions[bot] がプッシュした再実行ではコミットしないことでループを防ぐ
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && github.event_name == 'pull_request'
          && steps.git-check.outputs.modified == 'true'
          && github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Bash の globstar が無効だと "**/*.md" は 1 階層しか拾えずルート直下の .md を取りこぼす。
          # git のパススペック展開に任せるためクォートして渡し、ルート直下も含むよう '*.md' も追加。
          git ls-files -o -m --exclude-standard -- "**/*.md" "*.md" | xargs -r git add
          git commit -m "fix: auto-fix markdown lint issues"

      - name: Push changes (PR only)
        if: >-
          steps.changed-files.outputs.any_changed == 'true'
          && github.event_name == 'pull_request'
          && steps.git-check.outputs.modified == 'true'
          && github.actor != 'github-actions[bot]'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}

      - name: Run markdownlint (check only)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          config_found=false
          for f in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml \
            .markdownlint-cli2.json .markdownlint-cli2.cjs \
            .markdownlint-cli2.mjs .markdownlint.json \
            .markdownlint.yaml .markdownlint.yml; do
            if [ -f "$f" ]; then
              config_found=true
              break
            fi
          done

          if [ "$config_found" = true ]; then
            echo "Local markdownlint configuration found. Using it."
            markdownlint-cli2 "$MARKDOWN_GLOB"
          elif [ -f "$MARKDOWNLINT_CONFIG" ]; then
            echo "Local configuration not found. Using shared configuration: $MARKDOWNLINT_CONFIG"
            markdownlint-cli2 --config "$MARKDOWNLINT_CONFIG" "$MARKDOWN_GLOB"
          else
            echo "No markdownlint configuration found. Using default rules."
            markdownlint-cli2 "$MARKDOWN_GLOB"
          fi
