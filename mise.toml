[vars]
python_version = "$(cat .python-version 2>/dev/null || echo 'Error: .python-version not found')"
uv = 'uv'
text_red = '\033[0;31m'
text_green = '\033[0;32m'
text_yellow = '\033[0;33m'
text_blue = '\033[0;34m'
text_magenta = '\033[0;35m'
text_cyan = '\033[0;36m'
text_white = '\033[0;37m'
text_reset = '\033[0m'

########################
# 環境構築・初期化タスク #
########################

[tasks.init]
description = "初期化処理（仮想環境を作成し、依存関係をインストール）"
shell = "bash -c"
quiet = true
depends = ["venv"]
run = '''
# タスクスクリプトに実行権限を付与する
find ./mise -name "*.sh" -exec chmod +x {} \;

# terraform の初期化
dotenvx run -- terraform -chdir=terraform/github init

set -euo pipefail

if [ -f "{{env.MISE_CONFIG_ROOT}}/.env" ]; then
  set -a
  source "{{env.MISE_CONFIG_ROOT}}/.env"
  set +a
fi

if [ -n "${VIRTUAL_ENV:-}" ] && [ "${VIRTUAL_ENV}" != "{{env.MISE_CONFIG_ROOT}}/.venv" ]; then
  printf "ℹ️  他プロジェクトの仮想環境 (%s) が有効なため一時的に解除します。\n" "$VIRTUAL_ENV"
  unset VIRTUAL_ENV
fi

{{vars.uv}} lock
{{vars.uv}} sync --all-extras

printf "✅ プロジェクトの初期化が完了しました"
'''

[tasks.venv]
description = "uvを利用して仮想環境を作成します"
shell = "bash -c"
quiet = true
hide = true
run = '''
set -euo pipefail
project_root="${MISE_CONFIG_ROOT:-$PWD}"
venv_dir="${project_root}/.venv"
python_version="{{vars.python_version}}"

venv_python=""
if [ -f "$venv_dir/bin/python" ]; then
  venv_python="$venv_dir/bin/python"
elif [ -f "$venv_dir/Scripts/python.exe" ]; then
  venv_python="$venv_dir/Scripts/python.exe"
fi

current_version=""
if [ -n "$venv_python" ]; then
  current_version="$("$venv_python" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
fi

needs_recreate=false
if [ ! -d "$venv_dir" ] || [ -z "$venv_python" ]; then
  needs_recreate=true
elif [ "$current_version" != "$python_version" ]; then
  needs_recreate=true
fi

if [ "$needs_recreate" = true ]; then
  echo "Creating .venv with Python $python_version ..."
  mkdir -p "$venv_dir"
  chmod -R +w "$venv_dir" 2>/dev/null || true
  find "$venv_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
  {{vars.uv}} venv --python "$python_version" --allow-existing "$venv_dir"
else
  echo "Use existing .venv"
fi
'''

[tasks.reset-venv]
description = "仮想環境をリセットします"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
project_root="${MISE_CONFIG_ROOT:-$PWD}"
venv_dir="${project_root}/.venv"
python_version="{{vars.python_version}}"

echo "Resetting .venv ..."
mkdir -p "$venv_dir"
chmod -R +w "$venv_dir" 2>/dev/null || true
find "$venv_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
{{vars.uv}} venv --python "$python_version" --allow-existing "$venv_dir"
echo "done. Run 'mise run init' to sync dependencies."
'''

[tasks.upgrade]
description = "依存関係を最新のバージョンにアップグレードします"
shell = "bash -c"
quiet = true
depends = ["venv"]
run = '''
{{vars.uv}} sync --upgrade --all-extras
printf "✅ 依存関係のアップグレードが完了しました\n"
'''

######################
# Code Quality Tasks #
######################

[tasks.check]
description = "コードの静的解析とテストを実行します"
shell = "bash -c"
quiet = true
env = { SPARK_AUTH_ENV_FILE = ".env.test" }
run = '''
printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running ruff check..."
{{vars.uv}} run ruff check .
printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running mypy..."
{{vars.uv}} run mypy
printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running ty check..."
{{vars.uv}} run ty check .
printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running vulture..."
targets=()
if [ -d "src" ]; then targets+=("src"); fi
if [ -d "tests" ]; then targets+=("tests"); fi
if [ {% raw %}${#targets[@]}{% endraw %} -eq 0 ]; then
  targets+=(".")
fi
whitelist_paths=""
if [ -f vulture/whitelists/local.py ]; then
  whitelist_paths="vulture/whitelists/local.py"
fi
{{vars.uv}} run vulture --min-confidence 90 --exclude alembic "${targets[@]}" $whitelist_paths
printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running pytest..."
{{vars.uv}} run pytest tests/
if command -v markdownlint-cli2 >/dev/null 2>&1; then
  printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running markdownlint..."
  if [ -e .markdownlint-cli2.jsonc ]; then
    markdownlint-cli2 --config .markdownlint-cli2.jsonc
  else
    markdownlint-cli2 .
  fi
else
  printf "{{vars.text_red}}%s{{vars.text_reset}}\n" "markdownlint-cli2 is not installed; skipping markdown linting."
fi

printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running yamllint..."
{{vars.uv}} run yamllint . # .yamllint.yml は自動的に読み込まれる

if command -v shellcheck >/dev/null 2>&1; then
  printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running shellcheck..."
  shellcheck_files=()
  while IFS= read -r -d '' file; do
    shellcheck_files+=("$file")
  done < <(find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.venv/*" -not -path "./node_modules/*" -not -path "./.git/*" -print0)
  if [ "${shellcheck_files[0]+_}" ]; then
    shellcheck -x -P SCRIPTDIR "${shellcheck_files[@]}"
  else
    printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "No shell scripts found; skipping shellcheck."
  fi
else
  printf "{{vars.text_red}}%s{{vars.text_reset}}\n" "shellcheck is not installed; skipping shell script linting."
fi
'''

[tasks.format]
description = "コードのフォーマットを実行します"
shell = "bash -c"
quiet = true
run = '''
{{vars.uv}} run ruff format .
{{vars.uv}} run ruff check . --fix
if command -v markdownlint-cli2 >/dev/null 2>&1; then
  printf "{{vars.text_yellow}}%s{{vars.text_reset}}\n" "Running markdownlint fix..."
  if [ -e .markdownlint-cli2.jsonc ]; then
    markdownlint-cli2 --config .markdownlint-cli2.jsonc --fix
  else
    markdownlint-cli2 --fix .
  fi
else
  printf "{{vars.text_red}}%s{{vars.text_reset}}\n" "markdownlint-cli2 is not installed; skipping markdown formatting."
fi
'''

[tasks.clean]
description = "各種キャッシュ・一時ファイルを削除します"
shell = "bash -c"
quiet = true
run = '''
{{vars.uv}} run ruff clean
find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
rm -rf .pytest_cache 2>/dev/null || true
rm -rf .mypy_cache 2>/dev/null || true
rm -rf .ty_cache 2>/dev/null || true
'''

[tasks.encrypt]
description = "暗号化された .env.keys を生成する"
shell = "bash -c"
quiet = true
run = "dotenvx encrypt"

[tasks.decrypt]
description = "暗号化された .env.keys を復号化する"
shell = "bash -c"
quiet = true
run = "dotenvx decrypt"
