[tools]
dotenvx = "latest"
terraform = "latest"

[tasks.init]
description = "初期化処理（仮想環境を作成し、依存関係をインストール）"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail

# タスクスクリプトに実行権限を付与する
find ./mise -name "*.sh" -exec chmod +x {} \;
mise run venv

if terraform -chdir=terraform/github validate > /dev/null 2>&1; then
  echo "Terraform is Valid and Initialized."
else
  echo "Initializing Terraform..."
  dotenvx run -- terraform -chdir=terraform/github init
fi

if [ -f "{{env.MISE_CONFIG_ROOT}}/.env" ]; then
  set -a
  source "{{env.MISE_CONFIG_ROOT}}/.env"
  set +a
fi

if [ -n "${VIRTUAL_ENV:-}" ] && [ "${VIRTUAL_ENV}" != "{{env.MISE_CONFIG_ROOT}}/.venv" ]; then
  printf "ℹ️  他プロジェクトの仮想環境 (%s) が有効なため一時的に解除します。\n" "$VIRTUAL_ENV"
  unset VIRTUAL_ENV
fi

uv lock
uv sync --all-extras

printf "%b%s%b\n" '\033[0;32m' "✅ プロジェクトの初期化が完了しました" '\033[0m'
'''

[tasks.upgrade]
description = "依存関係を最新のバージョンにアップグレードします"
shell = "bash -c"
quiet = true
depends = ["venv"]
run = '''
uv sync --upgrade --all-extras
printf "✅ 依存関係のアップグレードが完了しました\n"
'''

[tasks.clean]
description = "各種キャッシュ・一時ファイルを削除します"
shell = "bash -c"
quiet = true
run = '''
uv run ruff clean
find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
rm -rf .pytest_cache 2>/dev/null || true
rm -rf .mypy_cache 2>/dev/null || true
rm -rf .ty_cache 2>/dev/null || true
'''

[tasks.encrypt]
description = "暗号化された .env.keys を生成する"
shell = "bash -c"
quiet = true
run = "dotenvx encrypt"

[tasks.decrypt]
description = "暗号化された .env.keys を復号化する"
shell = "bash -c"
quiet = true
run = "dotenvx decrypt"
